name: 🚀 CI Build & Test

permissions: {}

on:
  push:
    branches:
      - "feature/*"
      - "bug/*"
      - "hotfix/*"
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, closed]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "KnowledgeHub.slnx"

jobs:
  build-knowledgehub:
    name: Build KnowledgeHub (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --verbosity normal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

  test-unit:
    name: Unit Tests (xUnit)
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        run: dotnet test tests/KnowledgeHub.Tests.Unit/KnowledgeHub.Tests.Unit.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: unit-test-results
          path: "**/unit-tests.trx"
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests (SQLite)
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Integration Tests
        run: dotnet test tests/KnowledgeHub.Tests.Integration/KnowledgeHub.Tests.Integration.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: integration-test-results
          path: "**/integration-tests.trx"
          if-no-files-found: ignore

  blazor-client-validation:
    name: Blazor WASM Client Validation
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Blazor WASM Client
        run: dotnet build src/KnowledgeHub.Client/KnowledgeHub.Client.csproj --configuration Release --verbosity minimal

      - name: Validate WASM Assets
        run: |
          # Client is a Razor class library hosted by the Server: the build emits
          # _framework payloads (blazor.boot.json, dotnet.wasm, .dll) into
          # bin/<config>/net10.0/wwwroot; index.html lives in the source wwwroot
          # and is served by the Server host.
          fw="src/KnowledgeHub.Client/bin/Release/net10.0/wwwroot/_framework"
          if [ ! -f "$fw/blazor.boot.json" ]; then
            echo "::error::Blazor WASM _framework/blazor.boot.json nao encontrado em $fw"
            exit 1
          fi
          if [ ! -f "src/KnowledgeHub.Client/wwwroot/index.html" ]; then
            echo "::error::wwwroot/index.html ausente no projeto Client"
            exit 1
          fi
          echo "Blazor WASM assets gerados com sucesso"
          ls "$fw" | head -5

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: knowledgehub:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
