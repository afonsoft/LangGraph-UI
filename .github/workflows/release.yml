name: 🚀 Release & Publish

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  validate-tag:
    name: 🏷️ Validate Version Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔍 Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: 🔧 Restore & Build
        run: |
          dotnet restore KnowledgeHub.slnx
          dotnet build KnowledgeHub.slnx --configuration Release --no-restore

      - name: 📦 Publish Single-File (linux-x64)
        run: |
          dotnet publish src/KnowledgeHub.Server/KnowledgeHub.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/linux-x64

      - name: 📦 Publish Single-File (win-x64)
        run: |
          dotnet publish src/KnowledgeHub.Server/KnowledgeHub.Server.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/win-x64

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-${{ needs.validate-tag.outputs.version }}
          path: ./publish/**
          retention-days: 30

  publish-nuget:
    name: 📦 Publish NuGet Package
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
    if: ${{ env.NUGET_API_KEY != '' }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@8a6f6a3d9c7b2f1e0a9b8c7d6e5f4a3b2c1d0e9f   # v4
        with:
          name: knowledgehub-${{ needs.validate-tag.outputs.version }}
          path: ./publish

      - name: 📦 Push to NuGet
        run: |
          dotnet nuget push ./publish/**/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-docker:
    name: 🐳 Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@2a8a6b5e1d8e6b3c2b3b4f7a8e9f0a1b2c3d4e5f   # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/afonsoft/langgraph-ui:${{ needs.validate-tag.outputs.version }}
            ghcr.io/afonsoft/langgraph-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, publish-docker]
    permissions:
      contents: write
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@8a6f6a3d9c7b2f1e0a9b8c7d6e5f4a3b2c1d0e9f   # v4
        with:
          name: knowledgehub-${{ needs.validate-tag.outputs.version }}
          path: ./publish

      - name: 📝 Create Release
        uses: softprops/action-gh-release@8d7e9c4e0f6b1a2c3d4e5f6a7b8c9d0e1f2a3b4c   # v2
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          body: |
            ## 🚀 KnowledgeHub v${{ needs.validate-tag.outputs.version }}

            ### Downloads
            - **Linux (x64):** knowledgehub-linux-x64.zip
            - **Windows (x64):** knowledgehub-win-x64.zip
            - **Docker:** ghcr.io/afonsoft/langgraph-ui:${{ needs.validate-tag.outputs.version }}

            ### Changes
            Automated release from tag v${{ needs.validate-tag.outputs.version }}
          files: |
            ./publish/linux-x64/**
            ./publish/win-x64/**
          draft: false
          prerelease: false
